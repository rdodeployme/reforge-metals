      sites: [['Resource recovery centre', 'Ballarat', 'VIC'], ['Transfer station', 'Ballarat', 'VIC']] },
    { id: 'erg', name: 'Example Retail Group', type: 'Retail', contact: 'Sustainability Lead', mix: { aluminium: 4, stainless: 3, mixed: 2, ferrous: 1 }, base: 0.7, dest: { aunf: 4, aumfr: 3, export: 3 },
      sites: [['Distribution centre', 'Melbourne', 'VIC'], ['Store fit-outs — NSW', 'Sydney', 'NSW'], ['Store fit-outs — QLD', 'Brisbane', 'QLD'], ['Store fit-outs — WA', 'Perth', 'WA']] },
    { id: 'dam', name: 'Demo Appliance Manufacturer', type: 'Manufacturing', contact: 'Plant Manager', mix: { ferrous: 4, stainless: 3, copper: 2, aluminium: 1 }, base: 1.0, dest: { aumill: 4, aumfr: 3, aunf: 2, export: 1 },
      sites: [['Factory — Dandenong', 'Dandenong', 'VIC'], ['Factory — Newcastle', 'Newcastle', 'NSW']] },
  ].map((c) => ({ ...c, demo: true, sites: c.sites.map((s, i) => ({ id: `${c.id}-${i + 1}`, name: s[0], city: s[1], state: s[2] })) }));

  /* ---------- dates & periods ---------- */
  const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
  const iso = Kit.isoDate;
  const dOf = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
  const fmtDate = (d) => (typeof d === 'string' ? dOf(d) : d).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
  const fyStartYear = (d) => (d.getMonth() >= 6 ? d.getFullYear() : d.getFullYear() - 1);
  const PERIODS = (() => {
    const y = TODAY.getFullYear(), m = TODAY.getMonth();
    const fy = fyStartYear(TODAY);
    const q0 = Math.floor(m / 3) * 3;
    const qs = new Date(y, q0 - 3, 1), qe = new Date(y, q0, 0);
    const fyq = ((Math.floor(qs.getMonth() / 3) + 2) % 4) + 1;
    const ms = new Date(y, m - 1, 1), me = new Date(y, m, 0);
    const P = [
      { id: '12m', label: 'Last 12 months', start: new Date(y, m - 11, 1), end: TODAY },
      { id: 'fy', label: `This financial year (FY${String(fy + 1).slice(2)})`, short: `FY${String(fy + 1).slice(2)} to date`, start: new Date(fy, 6, 1), end: TODAY },
      { id: 'lastfy', label: `Last financial year (FY${String(fy).slice(2)})`, short: `FY${String(fy).slice(2)}`, start: new Date(fy - 1, 6, 1), end: new Date(fy, 5, 30) },
      { id: 'q', label: `Last quarter (Q${fyq} FY${String(fyStartYear(qs) + 1).slice(2)})`, short: `Q${fyq} FY${String(fyStartYear(qs) + 1).slice(2)}`, start: qs, end: qe },
      { id: 'm', label: `Last month (${ms.toLocaleString('en-AU', { month: 'long', year: 'numeric' })})`, short: ms.toLocaleString('en-AU', { month: 'long', year: 'numeric' }), start: ms, end: me },
    ];
    P.forEach((p) => { p.range = `${fmtDate(p.start)} – ${fmtDate(p.end)}`; p.short = p.short || p.label; });
    return P;
  })();
  const periodById = Object.fromEntries(PERIODS.map((p) => [p.id, p]));
  let periodId = store.get(KEY + ':period', '12m');
  if (!periodById[periodId]) periodId = '12m';
  const P = () => periodById[periodId];
  const inPeriod = (r, p = P()) => { const d = dOf(r.date); return d >= p.start && d <= p.end; };
  const periodSelect = () => C.select('period', PERIODS.map((p) => [p.id, p.label]), periodId);
  Kit.action('select:period', (v) => { periodId = v; store.set(KEY + ':period', v); Kit.refresh(); });

  function buckets(p = P()) {
    const out = [];
    const months = (p.end.getFullYear() - p.start.getFullYear()) * 12 + p.end.getMonth() - p.start.getMonth() + 1;
    if (months <= 3) {
      const s = new Date(p.start); s.setDate(s.getDate() - ((s.getDay() + 6) % 7));
      for (let d = s; d <= p.end; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7)) {
        const e = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 6);
        out.push({ label: `${d.getDate()} ${d.toLocaleString('en-AU', { month: 'short' })}`, start: d < p.start ? p.start : d, end: e > p.end ? p.end : e });
      }
    } else {
      for (let i = 0; i < months; i++) {
        const d = new Date(p.start.getFullYear(), p.start.getMonth() + i, 1);
        out.push({ label: d.toLocaleString('en-AU', { month: 'short' }), start: d, end: new Date(d.getFullYear(), d.getMonth() + 1, 0) });
      }
    }
    return out;
  }

  /* ---------- demonstration loads (fixed seed) ---------- */
  const DEMO_RECORDS = [];
  (function generate() {
    const R = Kit.rng('reforge-connect-v1');
    const between = (a, b) => a + (b - a) * R();
    const pickW = (obj) => { const e = Object.entries(obj); const sum = e.reduce((a, x) => a + x[1], 0); let x = R() * sum; for (const [k, w] of e) { x -= w; if (x <= 0) return k; } return e[0][0]; };
    const start = new Date(fyStartYear(TODAY) - 1, 6, 1);
    let seq = 2000;
    DEMO_PARTNERS.forEach((c) => {
      for (let d = new Date(start); d < TODAY; d.setDate(d.getDate() + 1)) {
        if (d.getDay() === 0 || d.getDay() === 6) continue;
        const growth = 0.7 + 0.4 * ((d - start) / (TODAY - start));
        if (R() > 0.22 * c.base * growth) continue;
        const stream = pickW(c.mix);
        const site = c.sites[Math.floor(R() * c.sites.length)];
        const S = STREAMS[stream];
        let t = { springsteel: between(6, 12), ferrous: between(2, 9), copper: between(0.2, 1.4), cable: between(0.4, 2.2), aluminium: between(0.3, 1.8), brass: between(0.1, 0.6), stainless: between(0.3, 1.6), mixed: between(1, 5) }[stream];
        t = Math.round(t * 100) / 100;
        const out = Math.round(t * S.recovery * between(0.96, 1.02) * 100) / 100;
        seq++;
        DEMO_RECORDS.push({ id: `D${seq}`, partner: c.id, site: site.id, date: iso(d), stream, t, out: Math.min(out, t), dest: pickW(c.dest), docket: `WB-${String(d.getFullYear()).slice(2)}${String(d.getMonth() + 1).padStart(2, '0')}-${seq}`, demo: true });
      }
    });
  })();

  /* ---------- stored data ---------- */
  let data = store.get(KEY + ':data', null) || { partners: [], records: [], hideDemo: false };
  data.partners ||= []; data.records ||= [];
  const save = () => store.set(KEY + ':data', data);
  const showDemo = () => !data.hideDemo;
  const partners = () => [...(showDemo() ? DEMO_PARTNERS : []), ...data.partners];
  const partnerById = (id) => DEMO_PARTNERS.find((c) => c.id === id) || data.partners.find((c) => c.id === id);
  const siteById = (id) => { for (const c of [...DEMO_PARTNERS, ...data.partners]) { const s = c.sites.find((x) => x.id === id); if (s) return s; } return null; };
  const visible = (r) => { const c = partnerById(r.partner); return !!c && (!c.demo || showDemo()); };
  const records = () => [...(showDemo() ? DEMO_RECORDS : []), ...data.records.filter(visible)].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  const mark = (name) => name.split(/\s+/).filter((w) => /^[A-Za-z0-9]/.test(w)).slice(0, 2).map((w) => w[0].toUpperCase()).join('') || 'PT';
  const siteLabel = (s) => (s ? `${s.name}${s.city ? ` · ${s.city}` : ''}${s.state ? ` ${s.state}` : ''}` : '—');

  /* the outcome of one load, in tonnes */
  function outcome(r) {
    const m = Kit.Impact.materials[r.stream];
    const recovered = r.out != null && r.out !== '' ? Math.min(r.t, Math.max(0, +r.out)) : r.t * m.recovery;
    return { recovered, residual: r.t - recovered, measured: r.out != null && r.out !== '' };
  }
  function agg(list) {
    const q = {}, ov = {};
    const dest = {};
    list.forEach((r) => {
      const o = outcome(r);
      q[r.stream] = (q[r.stream] || 0) + r.t;
      const v = ov[r.stream] || (ov[r.stream] = { recovered: 0, reused: 0 });
      v.recovered += o.recovered;
      dest[r.dest || 'stock'] = (dest[r.dest || 'stock'] || 0) + o.recovered;
    });
    const R = Kit.Impact.calc(q, ov);
    R.n = list.length;
    R.sites = new Set(list.map((r) => r.site)).size;
    R.list = list;
    R.dest = dest;
    R.domestic = DK.filter((k) => DEST[k].domestic && k !== 'stock').reduce((a, k) => a + (dest[k] || 0), 0);
    R.exported = dest.export || 0;
    R.stock = dest.stock || 0;
    return R;
  }
  const n1 = (v) => num(v, Math.abs(v) < 10 ? 1 : 0);
  const t2 = (v) => num(v, 2);
  const seriesOf = (list, p = P()) => buckets(p).map((b) => ({ b, R: agg(list.filter((r) => { const d = dOf(r.date); return d >= b.start && d <= b.end; })) }));
  const destParts = (R) => DK.filter((k) => R.dest[k]).map((k) => ({ label: DEST[k].name, value: R.dest[k], display: `${n1(R.dest[k])} t`, tone: k === 'export' ? 'reuse' : k === 'stock' ? 'landfill' : 'recycling' }));
  const whereParts = (R) => [['Recovered metal', R.recovered, 'recycling'], ['Residual', R.landfill, 'landfill']].map(([label, value, tone]) => ({ label, value, display: `${n1(value)} t`, tone }));
  const demoTag = (list) => (list.some((r) => r.demo) ? ' <span class="kit-tag kit-tag--ghost">Demo figures</span>' : '');

  /* ---------- scale comparisons (plain arithmetic, basis stated) ---------- */
  const compareMetal = (t) => {
    if (!(t > 0)) return '';
    const cars = t / 0.9, boxes = t / 25;
    return `<b>${num(t, t < 100 ? 1 : 0)} t</b> of recovered metal is about the steel in <b>${num(cars)}</b> family cars (≈0.9 t of steel each), or <b>${num(boxes, boxes < 10 ? 1 : 0)}</b> 40-ft containers of bales (≈25 t a box).`;
  };
  const compareCo2 = (t) => (t > 0 ? `<b>${n1(t)} t CO₂-e</b> is roughly what <b>${num(t / 4.6, t / 4.6 < 10 ? 1 : 0)}</b> cars emit in a year (US EPA: 4.6 t a car).` : '');
  Kit.compareTonnes = compareMetal;

  /* ---------- metals versions of the kit's impact blocks ---------- */
  C.impactHero = (R) => `<div class="kit-impact">

      <b class="kit-impact__v">${n1(R.co2Avoided)}<small style="font-size:.4em;margin-left:6px">t</small></b>

    </div>`;

  const chainStrip = (R) => `<div class="rf-chain">
    <div><span>1 · Weighed in</span><b>${n1(R.tonnes)}<small>t</small></b><em>${num(R.n)} load${R.n === 1 ? '' : 's'} over the weighbridge</em></div>
    <div><span>2 · Turned into</span><b>${R.rows.length}<small>product${R.rows.length === 1 ? '' : 's'}</small></b><em>${R.rows.slice(0, 2).map((x) => esc(STREAMS[x.id].product.split(' — ')[0])).join(' · ') || '—'}</em></div>

  Kit.reportImpactBlocks = (R, who) => [
    { title: 'Weighed in → turned into → recovered → saving', html: chainStrip(R) },
    { title: 'The difference it made', html: C.impactHero(R) },

    { title: 'By metal', meta: 'recovered weights measured unless marked', table: { cols: [
      { label: 'Metal in', render: (x) => `<span class="strong">${esc(x.name)}</span><div class="dim">${esc(STREAMS[x.id].product)}</div>` },
      { label: 'Weighed in', num: true, render: (x) => num(x.t, 2) + ' t' },
      { label: 'Recovered', num: true, render: (x) => `${num(x.recovered, 2)} t <span class="dim">(${pct(x.rate)})</span>` },

      { label: 'CO₂-e avoided', num: true, render: (x) => n1(x.avoided) + ' t' },
    ], rows: R.rows, foot: ['Total', num(R.tonnes, 1) + ' t', `${num(R.recovered, 1)} t (${pct(R.rate)})`, num(R.landfill, 1) + ' t', n1(R.co2Avoided) + ' t'], empty: 'Nothing recorded for this period.' } },
  ];
  Kit.reportMethodBlock = (owner) => ({ title: 'How these figures are worked out', html: `<ol class="kit-method">
      <li><b>Weighed in.</b> Every load crosses the weighbridge at North Geelong; the docket weight is the figure used.</li>

      <li><b>Saving.</b> Tonnes recovered × the published recycling credit for that metal — the carbon avoided by not making the same metal new from ore, net of collection and reprocessing (steel 1.5 t CO₂/t, worldsteel; copper 5.2, aluminium 7.9 and mixed metals 4.8 t CO₂-e/t, US EPA WARM). Metal in landfill does not break down, so no landfill methane is claimed.</li>
      <li><b>Trees.</b> CO₂-e avoided ÷ 0.060 t, what one tree seedling absorbs over ten years (US EPA).</li>
      <li>Factors marked as stand-ins (brass, stainless) and usual recovery rates should be read as estimates.</li>
    </ol>` });

  /* ---------- which partner the portal shows ---------- */
  let partnerId = store.get(KEY + ':partner', 'edc');
  const PT = () => { const list = partners(); return list.find((c) => c.id === partnerId) || list[0] || null; };
  const myRecords = (c = PT()) => (c ? records().filter((r) => r.partner === c.id) : []);

  /* ---------- boot ---------- */
  const partnerSide = {
    key: 'partner', label: 'Partner portal', home: 'overview', enter: 'Partner portal',
    searchLabel: 'Search loads, sites and dockets',
    nav: [
      { id: 'overview', label: 'Overview', icon: 'grid' },
      { id: 'loads', label: 'Your loads', icon: 'collection' },
      { id: 'journey', label: 'Where it went', icon: 'recovery' },
      { id: 'impact', label: 'Environmental saving', icon: 'impact' },
      { id: 'sites', label: 'Sites', icon: 'sites' },
      { id: 'reports', label: 'Statements & reports', icon: 'reporting' },
      { divider: 'About the numbers' },

    ],

    get org() { const c = PT(); return c ? { mark: mark(c.name), name: c.name, sub: `${c.sites.length} site${c.sites.length === 1 ? '' : 's'} · ${c.type || 'Partner'}` } : { mark: 'RF', name: 'No partner yet', sub: 'Add one on the corporate side' }; },
  };
  const corpSide = {
    key: 'corp', label: 'Corporate', home: 'overview', enter: 'Reforge Metals corporate',
    searchLabel: 'Search partners, sites, loads',
    nav: [
      { id: 'overview', label: 'Overview', icon: 'grid' },
      { id: 'record', label: 'Record a load', icon: 'plus' },
      { id: 'partners', label: 'Partners', icon: 'portfolio' },
      { id: 'loads', label: 'All loads', icon: 'collection' },
      { id: 'metals', label: 'Metals & outputs', icon: 'materials' },
      { id: 'dispatch', label: 'Dispatch & buyers', icon: 'recovery' },
      { id: 'reports', label: 'Reports', icon: 'reporting' },
      { divider: 'Settings' },
      { id: 'data', label: 'Data & backup', icon: 'layers' },
      { id: 'factors', label: 'Factors', icon: 'settings' },
    ],
    user: { name: WHO, role: 'Corporate' },
    get org() { return { mark: 'RF', name: WHO, sub: `${partners().length} partner${partners().length === 1 ? '' : 's'} · recorded and reported` }; },
  };

  Kit.boot({
    title: 'Reforge Connect',
    product: { name: 'Reforge Connect', word: 'Connect', logo: ASSETS.logo, logoH: 30, logoAlt: 'Reforge Metals' },
    get demo() { return showDemo() ? { badge: 'Demo partners on', text: 'The six demonstration partners and their loads are fictional. Turn them off under Corporate → Data & backup once real loads are going in.' } : null; },
    login: {
      line: 'Weighed in. Turned into. Recovered. Reported.',
      sub: 'Partners see every load they sent to Reforge Metals — the weight over the weighbridge, what it was turned into, how much metal was recovered, where it went and the carbon that saved. Reforge records the numbers and issues the statements.',
      foot: 'Reforge Metals · Connect',
      note: 'Choose a side of the platform.',
      small: 'No account needed in this version. Numbers entered are saved on this browser only.',
    },
    sides: [partnerSide, corpSide],
    topRight: (side) => {
      if (side.key !== 'partner') return `<a class="rgc-btn rgc-btn--sm" href="#/partner/overview">${icon('external', 14)} Partner portal</a>`;
      const list = partners();
      return list.length > 1 ? `<span class="kit-noprint" title="Choose which partner’s portal to view">${C.select('partner', list.map((c) => [c.id, c.name]), PT()?.id)}</span>` : '';
    },
    search: (side) => {
      const cl = side.key === 'partner' ? (PT() ? [PT()] : []) : partners();
      const recs = side.key === 'partner' ? myRecords() : records();
      return [
        ...(side.key === 'corp' ? cl.map((c) => ({ t: c.name, d: `Partner · ${c.type || ''}`, href: `#/corp/partners/${c.id}` })) : []),
        ...cl.flatMap((c) => c.sites.map((s) => ({ t: s.name, d: `Site · ${s.city || ''} ${s.state || ''}${side.key === 'corp' ? ' · ' + c.name : ''}`, href: side.key === 'partner' ? `#/partner/sites/${s.id}` : `#/corp/partners/${c.id}` }))),
        ...recs.slice(0, 400).map((r) => ({ t: r.docket || fmtDate(r.date), d: `${STREAMS[r.stream].name} · ${siteById(r.site)?.name || ''} · ${fmtDate(r.date)} · ${t2(r.t)} t`, href: `#/${side.key}/loads/${r.id}` })),
      ];
    },
  });
  Kit.action('select:partner', (v) => { partnerId = v; store.set(KEY + ':partner', v); if (!/^#\/partner\/(overview|loads|journey|impact|sites|reports|method)$/.test(location.hash)) Kit.go('#/partner/overview'); Kit.refresh(); });
  const usePartner = (id) => { if (id && id !== partnerId && partnerById(id)) { partnerId = id; store.set(KEY + ':partner', id); } };

  /* ---------- shared blocks ---------- */
  const auPins = (sites, hrefFn) => sites.map((s) => { const pl = place(s.city, s.state); return { id: s.id, ...Kit.AU.project(pl.lat, pl.lng), title: `${s.name} — ${s.city || ''} ${s.state || ''}`, href: hrefFn(s) }; });
  const noPartner = () => ({ title: 'No partners yet', html: C.note(`There are no partners to show. Add one under <a class="kit-green" href="#/corp/record?tab=partner">Corporate → Record a load → Add a partner</a>, or switch the demonstration partners back on under <a class="kit-green" href="#/corp/data">Data &amp; backup</a>.`) });
  const reportBtn = (action, dataset = {}, label = 'Download statement') => C.btn(label, { icon: 'download', action, primary: true, data: dataset });

  function loadsTable(list, side, o = {}) {
    return C.table([
      { label: 'Date', render: (r) => `<span class="strong">${fmtDate(r.date)}</span>` },
      ...(o.partner ? [{ label: 'Partner', render: (r) => esc(partnerById(r.partner)?.name || '—') }] : []),
      ...(o.site === false ? [] : [{ label: 'Site', render: (r) => { const s = siteById(r.site); return s ? `${esc(s.name)}<div class="dim">${esc(s.city || '')} ${esc(s.state || '')}</div>` : '—'; } }]),
      { label: 'Metal in', render: (r) => `${esc(STREAMS[r.stream].name)}<div class="dim">${esc(STREAMS[r.stream].product.split(' — ')[0])}</div>` },
      { label: 'Weighed in', num: true, render: (r) => t2(r.t) + ' t' },
      { label: 'Recovered', num: true, render: (r) => { const o2 = outcome(r); return `<span class="green">${t2(o2.recovered)} t</span><div class="dim">${pct(r.t ? o2.recovered / r.t : 0)}${o2.measured ? '' : ' · est.'}</div>`; } },
      { label: 'Went to', render: (r) => esc(DEST[r.dest || 'stock'].short) },
      { label: 'Docket', dim: true, render: (r) => esc(r.docket || '') },
      ...(o.remove ? [{ label: '', render: (r) => (r.demo ? '<span class="dim">demo</span>' : `<button type="button" class="rgc-btn rgc-btn--sm" data-action="record-remove" data-id="${esc(r.id)}">Remove</button>`) }] : []),
    ], list.slice(0, o.limit || 500), { rowHref: (r) => `#/${side}/loads/${r.id}`, empty: o.empty || 'No loads recorded for this period.' })
      + (list.length > (o.limit || 500) ? `<div class="kit-empty">Showing the latest ${o.limit || 500} of ${num(list.length)}. Export CSV for the full list.</div>` : '');
  }

  function overviewBody(list, side, o = {}) {
    const R = agg(list);
    const S = seriesOf(list);
    const top = [...R.rows].sort((a, b) => b.avoided - a.avoided)[0];
    return (list.length ? '' : C.note(o.emptyNote || 'Nothing recorded for this period yet.'))
      + chainStrip(R)
      + C.kpis([
        { label: 'Weighed in', value: n1(R.tonnes), unit: 't', foot: `${num(R.n)} load${R.n === 1 ? '' : 's'} · ${R.sites} site${R.sites === 1 ? '' : 's'}`, spark: S.map((x) => x.R.tonnes) },
        { label: 'Recovered', value: pct(R.rate), green: true, foot: `${n1(R.recovered)} t of saleable metal`, spark: S.map((x) => x.R.rate) },
        { label: 'CO₂-e avoided', value: n1(R.co2Avoided), unit: 't', foot: 'vs making the metal new', spark: S.map((x) => x.R.co2Avoided) },
        { label: 'Trees’ worth of carbon', value: num(R.trees), foot: 'what these trees absorb in 10 years', spark: S.map((x) => x.R.trees) },
      ])
      + C.impactHero(R)
      + C.grid('1.4fr 1fr',
        C.panel({ title: 'Weighed in and recovered', meta: 'tonnes', body: C.chart(S.map((x) => x.b.label), [
          { name: 'Weighed in', values: S.map((x) => x.R.tonnes), tone: 'grey' },
          { name: 'Recovered', values: S.map((x) => x.R.recovered), tone: 'green' }], { unit: 't', height: 250, dp: 1, key: true }) }),
        C.panel({ title: 'Highlights', list: true, flush: true, body: [
          R.recovered ? compareMetal(R.recovered) : '',
          R.co2Avoided ? compareCo2(R.co2Avoided) : '',
          top ? `Biggest carbon saving: <b>${esc(top.name.toLowerCase())}</b> — ${n1(top.avoided)} t CO₂-e avoided.` : '',
          R.domestic ? `<b>${n1(R.domestic)} t</b> supplied to Australian mills, foundries and manufacturers.` : '',
          R.exported ? `<b>${n1(R.exported)} t</b> containerised and exported.` : '',
          R.stock ? `<b>${n1(R.stock)} t</b> processed and in stock awaiting dispatch.` : '',
        ].filter(Boolean).map((h) => C.row({ t: `<span style="font-weight:500">${h}</span>`, cols: '1fr' })).join('') || C.row({ t: 'Nothing to highlight yet.', cols: '1fr' }) }))
      + C.panel({ title: `${WHO} vs landfill`, body: C.vsLandfill(R, WHO) })
      + (o.extra || '');
  }

  /* ======================================================================
     PARTNER PORTAL
     ====================================================================== */
  Kit.route('partner/overview', () => {
    const c = PT(); if (!c) return noPartner();
    const list = myRecords().filter((r) => inPeriod(r));
    return {
      title: 'Overview', sub: `${esc(c.name)} · ${esc(P().label)} · ${P().range}${demoTag(list)}`, demo: false,
      right: periodSelect() + reportBtn('partner-report'),
      html: overviewBody(list, 'partner', {
        extra: C.grid('1.4fr 1fr',
          C.panel({ title: 'Recent loads', link: { href: '#/partner/loads', label: 'All loads' }, flush: true, body: loadsTable(list, 'partner', { limit: 6 }) }),
          C.panel({ title: 'Where the metal went', meta: `${n1(agg(list).recovered)} t`, body: C.split(destParts(agg(list)), { cols: 1 }) })),
      }),
    };
  });

  Kit.route('partner/loads', () => {
    const c = PT(); if (!c) return noPartner();
    const list = myRecords().filter((r) => inPeriod(r));

    return {
      title: 'Your loads', sub: `${num(list.length)} loads · ${esc(P().label)}${demoTag(list)}`, demo: false,

  Kit.action('export-partner', () => exportCsv(myRecords().filter((r) => inPeriod(r)), `${(PT()?.name || 'partner').replace(/\W+/g, '-').toLowerCase()}-loads`));

  function loadPage(id, side) {
    const r = records().find((x) => x.id === id);
    if (!r) return { title: 'Load not found', html: C.note('That load doesn’t exist on this browser (it may have been removed, or demo partners are switched off).') };

    return {
      title: `${S.name} · ${fmtDate(r.date)}`, nav: 'loads', demo: false,
      crumb: `<a href="#/${side}/loads">Loads</a> / ${esc(side === 'corp' ? c.name + ' · ' : '')}${esc(s?.name || '')}`,
      sub: `${esc(siteLabel(s))}${r.docket ? ` · docket ${esc(r.docket)}` : ''}${r.demo ? ' <span class="kit-tag kit-tag--ghost">Demo figures</span>' : ''}`,
      right: reportBtn('load-report', { id: r.id }, 'Load statement') + (side === 'corp' && !r.demo ? C.btn('Remove', { action: 'record-remove', data: { id: r.id, back: '1' } }) : ''),
      html: chainStrip(R)
        + C.kpis([
          { label: 'Weighed in', value: t2(r.t), unit: 't', foot: r.docket ? `docket ${esc(r.docket)}` : 'weighbridge' },
          { label: 'Turned into', value: esc(S.product.split(' — ')[0]), foot: esc(S.short) },
          { label: 'Recovered', value: t2(o.recovered), unit: 't', green: true, foot: `${pct(r.t ? o.recovered / r.t : 0)}${o.measured ? ' · weighed out' : ' · usual rate (estimate)'}` },
          { label: 'CO₂-e avoided', value: n1(R.co2Avoided), unit: 't', foot: `${num(R.trees)} trees’ worth` },
        ])
        + C.grid('1fr 1.2fr',
          `<div class="kit-stack">${C.panel({ title: 'Where it went', body: C.split([...whereParts(R)], { cols: 1 }) + `<p class="kit-muted" style="font-size:13px;margin-top:12px">Recovered metal went to: <b>${esc(DEST[r.dest || 'stock'].name)}</b>.</p>` })}
          ${C.panel({ title: 'What happened to it', body: `<p style="font-size:13px;color:var(--app-text-2);line-height:1.6">${esc(S.path)}.</p>` })}</div>`,
          `<div class="kit-stack">${C.panel({ title: `${WHO} vs landfill`, body: C.vsLandfill(R, WHO) })}
          ${C.panel({ title: 'Details', body: C.review([['Partner', esc(c.name)], ['Site', esc(siteLabel(s))], ['Date', fmtDate(r.date)], ['Metal in', esc(S.name)], ['Turned into', esc(S.product)], ['Went to', esc(DEST[r.dest || 'stock'].name)], ['Docket', esc(r.docket || '—')], ...(r.note ? [['Note', esc(r.note)]] : [])]) })}</div>`),
    };
  }
  Kit.route('partner/loads/:id', ({ id }) => loadPage(id, 'partner'));

  Kit.route('partner/journey', () => {
    const c = PT(); if (!c) return noPartner();
    const list = myRecords().filter((r) => inPeriod(r));
    const R = agg(list);
    return {
      title: 'Where it went', sub: `${esc(c.name)} · ${esc(P().label)}${demoTag(list)}`, demo: false,
      right: periodSelect(),
      html: chainStrip(R)
        + C.grid('1fr 1fr',
          C.panel({ title: 'Recovered metal — destination', meta: `${n1(R.recovered)} t`, body: C.split(destParts(R), { cols: 1 }) }),
          C.panel({ title: 'Domestic vs export', body: C.stats([['Australian buyers', n1(R.domestic), 't', true], ['Exported', n1(R.exported), 't'], ['In stock', n1(R.stock), 't']], 3)
            + `<p class="kit-muted" style="font-size:13px;margin-top:16px;line-height:1.55">Australian buyers are steel mills, foundries, manufacturers and non-ferrous buyers. Export loads are containerised at North Geelong and shipped from Victorian ports.</p>` }))
        + C.panel({ title: 'Metal in → product out', flush: true, body: C.table([
          { label: 'Metal in', render: (x) => `<span class="strong">${esc(x.name)}</span>` },
          { label: 'Turned into', render: (x) => esc(STREAMS[x.id].product) },
          { label: 'Weighed in', num: true, render: (x) => n1(x.t) + ' t' },
          { label: 'Recovered', num: true, render: (x) => `<span class="green">${n1(x.recovered)} t</span> <span class="dim">${pct(x.rate)}</span>` },
          { label: 'Residual', num: true, render: (x) => n1(x.landfill) + ' t' },
        ], R.rows, { empty: 'Nothing recorded for this period.' }) }),
    };
  });

  Kit.route('partner/impact', () => {
    const c = PT(); if (!c) return noPartner();
    const list = myRecords().filter((r) => inPeriod(r));
    const R = agg(list);
    const all12 = agg(myRecords().filter((r) => inPeriod(r, periodById['12m'])));
    return {
      title: 'Environmental saving', sub: `${esc(c.name)} · ${esc(P().label)}${demoTag(list)}`, demo: false,
      right: periodSelect() + reportBtn('partner-report'),
      html: C.impactHero(R)
        + C.panel({ title: `${WHO} vs landfill`, body: C.vsLandfill(R, WHO) })
        + C.grid('1.4fr 1fr',
          C.panel({ title: 'By metal', flush: true, body: C.impactTable(R) }),
          C.panel({ title: 'Putting it in perspective', body: C.stats([['Recovered', n1(R.recovered), 't', true], ['Trees’ worth', num(R.trees), '']], 2)
            + `<p class="kit-muted" style="font-size:13px;margin-top:16px;line-height:1.55">${compareMetal(R.recovered) || 'Nothing recorded for this period yet.'}</p>`
            + (R.co2Avoided ? `<p class="kit-muted" style="font-size:13px;margin-top:8px;line-height:1.55">${compareCo2(R.co2Avoided)}</p>` : '')
            + (periodId !== '12m' ? `<div style="margin-top:16px">${C.stats([['Last 12 months', num(all12.trees), 'trees’ worth'], ['', n1(all12.co2Avoided), 't CO₂-e', true]], 2)}</div>` : '') }))
        + C.note('Figures are estimates worked out from the weighed tonnes and published recycling credits — see <a class="kit-green" href="#/partner/method">How it’s worked out</a>.'),
    };
  });

  Kit.route('partner/sites', () => {
    const c = PT(); if (!c) return noPartner();
    const list = myRecords().filter((r) => inPeriod(r));
    const rows = c.sites.map((s) => ({ s, R: agg(list.filter((r) => r.site === s.id)) })).sort((a, b) => b.R.tonnes - a.R.tonnes);
    const states = new Set(c.sites.map((s) => s.state).filter(Boolean)).size;
    return {
      title: 'Sites', sub: `${c.sites.length} site${c.sites.length === 1 ? '' : 's'}${states ? ` across ${states} state${states > 1 ? 's' : ''}` : ''} · ${esc(P().label)}`, demo: false,
      right: periodSelect(),
      html: C.grid('1.2fr 1fr',
        C.panel({ title: 'Map', meta: 'select a site', flush: true, body: C.map({ land: ASSETS.auLand, pins: auPins(c.sites, (s) => `#/partner/sites/${s.id}`), label: 'Sites', legend: `<span><i></i>Site</span><span>${c.sites.length} sites</span>` }) }),
        C.panel({ title: 'Sites', meta: 'tonnes · recovered', flush: true, body: rows.length ? C.rank(rows.map((x) => ({ t: x.s.name, s: `${esc(x.s.city || '')} ${esc(x.s.state || '')} · ${n1(x.R.co2Avoided)} t CO₂-e avoided`, value: x.R.tonnes, v1: `${n1(x.R.tonnes)} t`, v2: pct(x.R.rate), href: `#/partner/sites/${x.s.id}` })), { numbered: true, cols: '1.4fr 1fr 64px 50px' }) : '<div class="kit-empty">No sites yet.</div>' })),
    };
  });

  Kit.route('partner/sites/:id', ({ id }) => {
    const s = siteById(id);
    const c = s && partners().find((x) => x.sites.includes(s));
    if (!s || !c) return { title: 'Site not found', html: '' };
    usePartner(c.id);
    const list = myRecords().filter((r) => r.site === id && inPeriod(r));
    const R = agg(list);
    return {
      title: s.name, nav: 'sites', crumb: `<a href="#/partner/sites">Sites</a> / ${esc(s.state || '')}`, demo: false,
      sub: `${esc(s.city || '')} ${esc(s.state || '')} · ${esc(c.name)} · ${esc(P().label)}${demoTag(list)}`,
      right: periodSelect() + reportBtn('site-report', { site: id }, 'Site statement'),
      html: chainStrip(R)
        + C.grid('1.5fr 1fr',
          C.panel({ title: 'Loads from this site', flush: true, body: loadsTable(list, 'partner', { site: false, limit: 12 }) }),
          `<div class="kit-stack">${C.panel({ title: 'Where the metal went', meta: `${n1(R.recovered)} t`, body: C.split(destParts(R), { cols: 1 }) })}
          ${C.panel({ title: 'By metal', body: R.rows.length ? C.bars(R.rows.map((x) => ({ label: x.name, value: x.t, display: `${n1(x.t)} t` }))) : '<div class="kit-empty">Nothing recorded.</div>' })}</div>`),
    };
  });

  function reportCards(c) {
    const all = records().filter((r) => r.partner === c.id);
    return C.panel({ title: 'Recovery statements', meta: 'A4 · saves as PDF', flush: true, list: true, body: PERIODS.map((p) => {
      const R = agg(all.filter((r) => inPeriod(r, p)));
      return C.row({ icon: 'reporting', t: `${esc(p.short)} recovery statement`, d: `${p.range} · ${n1(R.tonnes)} t in · ${n1(R.recovered)} t recovered · ${n1(R.co2Avoided)} t CO₂-e avoided`, r: reportBtn('partner-report', { partner: c.id, period: p.id }, 'Download'), cols: '36px 1fr auto' });
    }).join('') })
      + C.panel({ title: 'Site statements', meta: esc(P().label), flush: true, list: true, body: c.sites.map((s) => {
        const R = agg(all.filter((r) => r.site === s.id && inPeriod(r)));
        return C.row({ icon: 'sites', t: esc(s.name), d: `${esc(s.city || '')} ${esc(s.state || '')} · ${n1(R.tonnes)} t in · ${pct(R.rate)} recovered`, r: reportBtn('site-report', { site: s.id }, 'Download'), cols: '36px 1fr auto' });
      }).join('') || '<div class="kit-empty">No sites.</div>' });
  }
  Kit.route('partner/reports', () => {
    const c = PT(); if (!c) return noPartner();
    const R = agg(myRecords().filter((r) => inPeriod(r)));
    return {
      title: 'Statements & reports', sub: `${esc(c.name)} · recovery statements for any period, one per site, and one per load`, demo: false,
      right: periodSelect(),
      html: C.grid('1.5fr 1fr', `<div class="kit-stack">${reportCards(c)}</div>`,
        C.panel({ title: 'What’s in a statement', body: `<div class="kit-cover" role="img" aria-label="Statement cover preview" style="margin-bottom:16px"><img src="${ASSETS.logo}" alt=""><div><h3>Recovery statement</h3><p>${esc(P().range)}</p><p>${esc(c.name)}</p></div><div class="kit-cover__band"><div><span>Weighed in</span><b>${n1(R.tonnes)} t</b></div><div><span>Recovered</span><b>${pct(R.rate)}</b></div><div><span>CO₂-e</span><b class="g">${n1(R.co2Avoided)} t</b></div></div></div>
          <ul style="margin:0;padding-left:16px;color:var(--app-text-2);display:grid;gap:6px;font-size:13px"><li>Weighed in → turned into → recovered → saving, for the period</li><li>Every load with its docket number, weight in and weight out</li><li>Where the recovered metal went — Australian mill, foundry, manufacturer or export</li><li>CO₂-e avoided and trees’ worth, by metal</li><li>How the figures are worked out, with sources</li></ul>` })),
    };
  });

  Kit.route('partner/method', () => ({
    title: 'How it’s worked out', nav: 'method', demo: false, sub: 'The weights, recovery rates and published factors behind every figure',
    html: C.factorsPage(WHO).replace(/tap a number to change it/, 'set by Reforge Metals'),
    after: (el) => {
      el.querySelectorAll('[data-factor]').forEach((i) => { i.disabled = true; });
      el.querySelector('[data-action="factors-reset"]')?.closest('.kit-toolbar')?.remove();
      const n = el.querySelector('.kit-note > div');
      if (n) n.innerHTML = 'These are the numbers behind every figure in your portal and statements. <b>Published factors</b> show their source. Usual recovery rates are only used when a load’s own weighed output wasn’t recorded — those loads are marked as estimates.';
      const m = el.querySelector('.kit-method');
      if (m) m.outerHTML = Kit.reportMethodBlock(WHO).html;

  }));

  /* ======================================================================
     CORPORATE
     ====================================================================== */
  Kit.route('corp/overview', () => {
    const list = records().filter((r) => inPeriod(r));
    const rows = partners().map((c) => ({ c, R: agg(list.filter((r) => r.partner === c.id)) })).sort((a, b) => b.R.tonnes - a.R.tonnes);
    return {
      title: 'Overview', sub: `All partners · ${esc(P().label)} · ${P().range}${demoTag(list)}`, demo: false,
      right: periodSelect() + C.btn('Record a load', { href: '#/corp/record', icon: 'plus' }) + reportBtn('group-report', {}, 'Group report'),
      html: overviewBody(list, 'corp', {
        emptyNote: `Nothing recorded for this period. <a class="kit-green" href="#/corp/record">Record a load</a> — one at a time, or paste a weighbridge list.`,
        extra: C.panel({ title: 'Partners', meta: 'tonnes in · recovered', link: { href: '#/corp/partners', label: 'All partners' }, flush: true, body: rows.length
          ? C.rank(rows.map((x) => ({ t: x.c.name, s: `${esc(x.c.type || '')} · ${n1(x.R.co2Avoided)} t CO₂-e avoided · ${num(x.R.trees)} trees’ worth`, value: x.R.tonnes, v1: `${n1(x.R.tonnes)} t`, v2: pct(x.R.rate), href: `#/corp/partners/${x.c.id}` })), { numbered: true, cols: '1.5fr 1fr 70px 50px' })
          : `<div class="kit-empty">No partners yet — <a class="kit-green" href="#/corp/record?tab=partner">add one</a>.</div>` }),
      }),
    };
  });

  /* ---------- RECORD A LOAD ---------- */
  const blankForm = () => ({ partner: '', site: '', date: iso(TODAY), stream: 'springsteel', t: '', mode: 'usual', out: '', dest: 'aumill', docket: '', note: '' });
  let form = { ...blankForm(), ...store.get(KEY + ':form', {}) };
  const saveForm = () => store.set(KEY + ':form', form);
  const fixForm = () => {
    const list = partners();
    if (!list.find((c) => c.id === form.partner)) form.partner = list[0]?.id || '';
    const c = partnerById(form.partner);
    if (c && !c.sites.find((s) => s.id === form.site)) form.site = c.sites[0]?.id || '';
    if (!STREAMS[form.stream]) form.stream = 'springsteel';
    if (!DEST[form.dest]) form.dest = 'aumill';
  };
  const formRecord = () => ({ partner: form.partner, site: form.site, date: form.date, stream: form.stream, t: parseFloat(form.t) > 0 ? parseFloat(form.t) : 0,
    out: form.mode === 'weighed' && form.out !== '' ? +form.out : null, dest: form.dest, docket: String(form.docket || '').trim(), note: String(form.note || '').trim() });
  const livePreview = () => {
    const r = formRecord();
    const R = agg(r.t > 0 ? [r] : []);
    const set = (k, v) => document.querySelectorAll(`[data-live="${k}"]`).forEach((el) => { el.innerHTML = v; });

  const matchStream = (v) => { const s = String(v || '').toLowerCase(); const hit = SK.find((k) => k === s || STREAMS[k].name.toLowerCase() === s) || (MAT_ALIAS.find(([, re]) => re.test(s)) || [])[0]; return hit || null; };
  const matchDest = (v) => { const s = String(v || '').toLowerCase(); if (!s) return null; if (/export|container|ship/.test(s)) return 'export'; if (/foundry/.test(s)) return 'aufoundry'; if (/manufact/.test(s)) return 'aumfr'; if (/non|copper|alumin|nf/.test(s)) return 'aunf'; if (/stock|held|yard/.test(s)) return 'stock'; if (/mill|steel|au/.test(s)) return 'aumill'; return null; };
  const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  function parseDate(v) {
    const s = String(v || '').trim();
    let m;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return iso(new Date(+m[1], m[2] - 1, +m[3]));

  }

  function parsePaste(text) {
    const rows = Kit.parseTable(text);

    const hasHead = !parseDate(rows[0][0]) && head.some((h) => /date|partner|client|metal|tonne|weight/.test(h));
    const idx = {};
    if (hasHead) {
      const used = new Set();
      ['out', 'docket', 'date', 'partner', 'site', 'stream', 'dest', 't', 'city', 'state'].forEach((k) => { const i = head.findIndex((h, j) => !used.has(j) && COLS[k].test(h)); if (i >= 0) { idx[k] = i; used.add(i); } });

      const out = { line: n + 1 + (hasHead ? 1 : 0), raw: r, problems: [] };

    };
  });

  Kit.route('corp/partners/:id', ({ id }) => {
    const c = partners().find((x) => x.id === id);
    if (!c) return { title: 'Partner not found', nav: 'partners', html: C.note('That partner isn’t on this browser (or demonstration partners are switched off).') };
    const list = records().filter((r) => r.partner === id && inPeriod(r));
    const R = agg(list);
    const rows = c.sites.map((s) => ({ s, R: agg(list.filter((r) => r.site === s.id)) })).sort((a, b) => b.R.tonnes - a.R.tonnes);
    return {
      title: c.name, nav: 'partners', crumb: '<a href="#/corp/partners">Partners</a>', demo: false,
      sub: `${esc(c.type || '')} · ${c.sites.length} site${c.sites.length === 1 ? '' : 's'} · ${esc(P().label)}${demoTag(list)}`,
      right: periodSelect() + C.btn('Record a load', { action: 'record-for', data: { partner: id }, icon: 'plus' }) + C.btn('Open their portal', { action: 'open-portal', data: { partner: id }, icon: 'external' }) + reportBtn('partner-report', { partner: id }),
      html: chainStrip(R)
        + C.grid('1fr 1fr',
          C.panel({ title: 'Sites', flush: true, body: C.table([
            { label: 'Site', render: (x) => `<span class="strong">${esc(x.s.name)}</span><div class="dim">${esc(x.s.city || '')} ${esc(x.s.state || '')}</div>` },
            { label: 'Weighed in', num: true, render: (x) => `${n1(x.R.tonnes)} t` },
            { label: 'Recovered', num: true, render: (x) => `<span class="green">${pct(x.R.rate)}</span>` },
            { label: '', render: (x) => reportBtn('site-report', { site: x.s.id }, 'Statement').replace('rgc-btn--primary', 'rgc-btn--sm') },
          ], rows) }),
          `<div class="kit-stack">${C.panel({ title: 'Where the metal went', body: C.split(destParts(R), { cols: 1 }) })}${C.panel({ title: 'By metal', body: R.rows.length ? C.bars(R.rows.map((x) => ({ label: x.name, value: x.t, display: `${n1(x.t)} t` }))) : '<div class="kit-empty">Nothing recorded.</div>' })}</div>`)
        + C.panel({ title: 'Loads', meta: 'newest first', flush: true, body: loadsTable(list, 'corp', { remove: true, limit: 50 }) }),
    };
  });
  Kit.action('record-for', (btn) => { form.partner = btn.dataset.partner; form.site = ''; fixForm(); saveForm(); Kit.go('#/corp/record?tab=one'); });
  Kit.action('open-portal', (btn) => { partnerId = btn.dataset.partner; store.set(KEY + ':partner', partnerId); Kit.go('#/partner/overview'); });

  /* ---------- ALL LOADS ---------- */
  let loadPartner = 'all';
  Kit.route('corp/loads', () => {
    const list = records().filter((r) => inPeriod(r) && (loadPartner === 'all' || r.partner === loadPartner));
    const R = agg(list);
    return {
      title: 'All loads', sub: `${num(list.length)} loads · ${esc(P().label)}${demoTag(list)}`, demo: false,
      right: C.select('load-partner', [['all', 'All partners'], ...partners().map((c) => [c.id, c.name])], loadPartner) + periodSelect() + C.btn('Export CSV', { icon: 'download', action: 'export-all' }),
      html: C.kpis([
        { label: 'Loads', value: num(R.n) },
        { label: 'Weighed in', value: n1(R.tonnes), unit: 't' },
        { label: 'Recovered', value: pct(R.rate), green: true, foot: `${n1(R.recovered)} t` },
        { label: 'CO₂-e avoided', value: n1(R.co2Avoided), unit: 't', foot: `${num(R.trees)} trees’ worth` },
      ]) + C.panel({ flush: true, body: loadsTable(list, 'corp', { partner: loadPartner === 'all', remove: true }) }),
    };
  });
  Kit.action('select:load-partner', (v) => { loadPartner = v; Kit.refresh(); });
  Kit.action('export-all', () => exportCsv(records().filter((r) => inPeriod(r) && (loadPartner === 'all' || r.partner === loadPartner)), 'reforge-loads'));
  Kit.route('corp/loads/:id', ({ id }) => loadPage(id, 'corp'));

  /* ---------- METALS & OUTPUTS ---------- */
  Kit.route('corp/metals', () => {
    const list = records().filter((r) => inPeriod(r));
    const R = agg(list);
    const S = seriesOf(list);
    return {
      title: 'Metals & outputs', sub: `All partners · ${esc(P().label)}${demoTag(list)}`, demo: false,
      right: periodSelect(),
      html: C.kpis([
        { label: 'Weighed in', value: n1(R.tonnes), unit: 't' },
        { label: 'Recovered', value: n1(R.recovered), unit: 't', green: true, foot: `${pct(R.rate)} of what came in` },
        { label: 'Residual', value: n1(R.landfill), unit: 't', foot: 'reported, not hidden' },
        { label: 'CO₂-e avoided', value: n1(R.co2Avoided), unit: 't' },
      ])
        + C.panel({ title: 'Metal in → product out', flush: true, body: C.table([
          { label: 'Metal in', render: (x) => `<span class="strong">${esc(x.name)}</span><div class="dim kit-wrap" style="white-space:normal;max-width:320px">${esc(STREAMS[x.id].path)}</div>` },
          { label: 'Turned into', render: (x) => esc(STREAMS[x.id].product) },
          { label: 'Weighed in', num: true, render: (x) => n1(x.t) + ' t' },
          { label: 'Recovered', num: true, render: (x) => `<span class="green">${n1(x.recovered)} t</span> <span class="dim">${pct(x.rate)}</span>` },
          { label: 'CO₂-e avoided', num: true, render: (x) => n1(x.avoided) + ' t' },
        ], R.rows, { empty: 'Nothing recorded for this period.' }) })
        + C.panel({ title: 'Recovered over time', meta: '%', body: C.chart(S.map((x) => x.b.label), [{ name: 'Recovered', values: S.map((x) => x.R.rate * 100), tone: 'green' }], { unit: '%', max: 100, height: 220 }) }),
    };
  });

  /* ---------- DISPATCH & BUYERS ---------- */
  Kit.route('corp/dispatch', () => {
    const list = records().filter((r) => inPeriod(r));
    const R = agg(list);
    const S = seriesOf(list);
    const byDest = DK.map((k) => ({ k, R: agg(list.filter((r) => (r.dest || 'stock') === k)) })).filter((x) => x.R.n);
    return {
      title: 'Dispatch & buyers', sub: `Where the recovered metal went · ${esc(P().label)}${demoTag(list)}`, demo: false,
      right: periodSelect(),
      html: C.kpis([
        { label: 'Recovered', value: n1(R.recovered), unit: 't' },
        { label: 'Australian buyers', value: n1(R.domestic), unit: 't', green: true, foot: 'mills, foundries, manufacturers, non-ferrous' },
        { label: 'Exported', value: n1(R.exported), unit: 't', foot: 'containerised at North Geelong' },
        { label: 'In stock', value: n1(R.stock), unit: 't', foot: 'processed, awaiting dispatch' },
      ])
        + C.grid('1fr 1.4fr',
          C.panel({ title: 'By destination', meta: `${n1(R.recovered)} t`, body: C.split(destParts(R), { cols: 1 }) }),
          C.panel({ title: 'Domestic and export over time', meta: 'tonnes recovered', body: C.chart(S.map((x) => x.b.label), [
            { name: 'Australian buyers', values: S.map((x) => x.R.domestic), tone: 'green' },
            { name: 'Exported', values: S.map((x) => x.R.exported), tone: 'grey' }], { unit: 't', height: 240, dp: 1, key: true }) }))
        + C.panel({ title: 'Destinations', flush: true, body: C.table([
          { label: 'Destination', render: (x) => `<span class="strong">${esc(DEST[x.k].name)}</span>` },
          { label: 'Loads', num: true, render: (x) => num(x.R.n) },
          { label: 'Recovered metal', num: true, render: (x) => `${n1(x.R.recovered)} t` },
          { label: 'Metals', wrap: true, render: (x) => `<span class="dim">${x.R.rows.map((r) => esc(STREAMS[r.id].short)).join(', ')}</span>` },
        ], byDest, { empty: 'Nothing dispatched in this period.' }) }),
    };
  });

  /* ---------- REPORTS ---------- */
  Kit.route('corp/reports', () => {
    const list = records().filter((r) => inPeriod(r));
    const R = agg(list);
    return {
      title: 'Reports', sub: `Recovery statements for the group, each partner and each site · ${esc(P().label)}`, demo: false,
      right: periodSelect(),
      html: C.panel({ title: 'Group report', flush: true, list: true, body: C.row({ icon: 'reporting', t: `${WHO} — ${esc(P().short)}`, d: `${P().range} · ${partners().length} partners · ${n1(R.tonnes)} t in · ${pct(R.rate)} recovered · ${n1(R.co2Avoided)} t CO₂-e avoided`, r: reportBtn('group-report', {}, 'Download'), cols: '36px 1fr auto' }) })
        + C.panel({ title: 'Partner statements', meta: esc(P().label), flush: true, list: true, body: partners().map((c) => {
          const CR = agg(list.filter((r) => r.partner === c.id));
          return C.row({ icon: 'portfolio', t: esc(c.name), d: `${n1(CR.tonnes)} t in · ${pct(CR.rate)} recovered · ${n1(CR.co2Avoided)} t CO₂-e avoided${c.demo ? ' · demo' : ''}`, r: reportBtn('partner-report', { partner: c.id }, 'Download'), cols: '36px 1fr auto' });
        }).join('') || '<div class="kit-empty">No partners yet.</div>' })
        + C.note('Each statement opens as A4 pages in the Connect look. Use <b>Download PDF</b> (your browser’s Save as PDF), or switch to the light version for printing. Site statements are on each partner’s page; load statements on each load.'),
    };
  });

  /* ---------- DATA & FACTORS ---------- */
  Kit.route('corp/data', () => ({
    title: 'Data & backup', sub: 'Demo partners, backups and spreadsheets', demo: false,
    right: C.btn('Export CSV', { icon: 'download', action: 'export-everything', primary: true }),
    html: C.panel({ title: 'Demonstration partners', flush: true, body: C.row({ t: 'Show the six demonstration partners and their loads', d: 'Handy while setting up. Turn off once real partners are in — the portal and statements then show only what’s been recorded.', r: C.toggle(showDemo(), 'show-demo'), cols: '1fr auto' }) })
      + C.panel({ title: 'On this browser', body: C.stats([['Partners added', num(data.partners.length)], ['Loads recorded', num(data.records.length)], ['Tonnes weighed in', n1(data.records.reduce((a, r) => a + r.t, 0))]], 3) })
      + C.backupBox(KEY + ':', 'Reforge Connect')
      + C.panel({ title: 'Load a spreadsheet', body: `<p class="kit-muted" style="font-size:13px;margin-bottom:10px;line-height:1.55">A CSV with headings <b>Date, Partner, Site, Metal, Tonnes</b> (plus optional Recovered t, Went to, Docket, City, State) — the same layout Export CSV produces. Rows are checked on <b>Record a load → Paste</b> before anything is added.</p><label class="rgc-btn" style="cursor:pointer">${icon('upload', 15)} Choose CSV<input type="file" accept=".csv,text/csv" data-file="records-csv" hidden></label>` }),
  }));
  Kit.action('toggle:show-demo', (on) => { data.hideDemo = !on; save(); Kit.refresh(); });
  Kit.action('file:records-csv', (file) => file && file.text().then((txt) => { pending = parsePaste(txt); Kit.go('#/corp/record?tab=paste'); setTimeout(() => Kit.toast(`${pending.length} rows read — check them, then add.`), 60); }));
  function exportCsv(list, name) {
    if (!list.length) { Kit.toast('Nothing to export for this period.'); return; }
    const rows = [['Date', 'Partner', 'Site', 'City', 'State', 'Metal', 'Turned into', 'Tonnes', 'Recovered t', 'Residual t', 'Recovered %', 'Went to', 'CO2-e avoided t', 'Docket', 'Output', 'Demo']];
    list.forEach((r) => {
      const c = partnerById(r.partner), s = siteById(r.site), o = outcome(r), R = agg([r]);
      rows.push([r.date, c?.name || '', s?.name || '', s?.city || '', s?.state || '', STREAMS[r.stream].name, STREAMS[r.stream].product, r.t, +o.recovered.toFixed(3), +o.residual.toFixed(3), Math.round(R.rate * 100), DEST[r.dest || 'stock'].name, +R.co2Avoided.toFixed(3), r.docket || '', o.measured ? 'weighed' : 'usual', r.demo ? 'demo' : '']);
    });
    Kit.download(`${name}-${iso(new Date())}.csv`, Kit.csv(rows), 'text/csv');
  }
  Kit.action('export-everything', () => exportCsv(records(), 'reforge-all'));
  Kit.route('corp/factors', () => ({
    title: 'Factors', demo: false, sub: 'Usual recovery rates and the published recycling credits behind every figure',
    html: C.factorsPage(WHO).replace('<b>Reforge Metals assumptions</b> (weights, recovery rates)', '<b>Usual recovery rates</b> are Reforge Metals’ operating assumptions, used only when a load’s own output weight isn’t recorded. They'),
    after: (el) => { const m = el.querySelector('.kit-method'); if (m) m.outerHTML = Kit.reportMethodBlock(WHO).html; },
  }));

  /* ======================================================================
     STATEMENTS (A4 → PDF)
     ====================================================================== */
  const nowText = () => new Date().toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });
  const fileBit = (s) => String(s).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '');
  function recoveryReport(o) {
    const list = o.list;
    const R = agg(list);
    const p = o.period;
    const S = seriesOf(list, p);
    const anyDemo = list.some((r) => r.demo) || o.demoPartner;
    const siteRows = o.sites ? o.sites.map((s) => ({ s, R: agg(list.filter((r) => r.site === s.id)) })).filter((x) => x.R.n).sort((a, b) => b.R.tonnes - a.R.tonnes) : [];
    const blocks = [
      ...Kit.reportImpactBlocks(R, WHO),
      { title: 'Where the recovered metal went', meta: `${n1(R.recovered)} t`, html: C.split(destParts(R), { cols: 3 }) },
      { title: 'Weighed in and recovered', meta: 'tonnes', html: C.chart(S.map((x) => x.b.label), [{ name: 'Weighed in', values: S.map((x) => x.R.tonnes), tone: 'grey' }, { name: 'Recovered', values: S.map((x) => x.R.recovered), tone: 'green' }], { unit: 't', height: 220, dp: 1, key: true }) },
    ];
    if (o.byPartner) blocks.push({ title: 'By partner', table: { cols: [
      { label: 'Partner', render: (x) => `<span class="strong">${esc(x.c.name)}</span>` },
      { label: 'Loads', num: true, render: (x) => num(x.R.n) },
      { label: 'Weighed in', num: true, render: (x) => n1(x.R.tonnes) + ' t' },
      { label: 'Recovered', num: true, render: (x) => pct(x.R.rate) },
      { label: 'CO₂-e avoided', num: true, render: (x) => `${n1(x.R.co2Avoided)} t` },
    ], rows: o.byPartner.map((c) => ({ c, R: agg(list.filter((r) => r.partner === c.id)) })).filter((x) => x.R.n).sort((a, b) => b.R.tonnes - a.R.tonnes), foot: ['Total', num(R.n), n1(R.tonnes) + ' t', pct(R.rate), `${n1(R.co2Avoided)} t`] } });
    if (siteRows.length > 1) blocks.push({ title: 'By site', table: { cols: [
      { label: 'Site', render: (x) => `<span class="strong">${esc(x.s.name)}</span> <span class="dim">${esc(x.s.city || '')} ${esc(x.s.state || '')}</span>` },
      { label: 'Loads', num: true, render: (x) => num(x.R.n) },
      { label: 'Weighed in', num: true, render: (x) => n1(x.R.tonnes) + ' t' },
      { label: 'Recovered', num: true, render: (x) => pct(x.R.rate) },
      { label: 'CO₂-e avoided', num: true, render: (x) => `${n1(x.R.co2Avoided)} t` },
    ], rows: siteRows } });
    if (o.listLoads) blocks.push({ title: 'Loads', meta: `${num(list.length)} in this period`, table: { cols: [
      { label: 'Date', render: (r) => `<span style="white-space:nowrap">${dOf(r.date).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: '2-digit' })}</span>` },
      ...(o.sites && o.sites.length > 1 ? [{ label: 'Site', render: (r) => esc(siteById(r.site)?.name || '') }] : []),
      { label: 'Metal in', render: (r) => esc(STREAMS[r.stream].short) },
      { label: 'In', num: true, render: (r) => t2(r.t) },
      { label: 'Out', num: true, render: (r) => { const x = outcome(r); return t2(x.recovered) + (x.measured ? '' : '<span class="dim">*</span>'); } },
      { label: 'Went to', render: (r) => esc(DEST[r.dest || 'stock'].short) },
      { label: 'Docket', render: (r) => `<span class="dim" style="white-space:nowrap">${esc(r.docket || '')}</span>` },
    ], rows: [...list].sort((a, b) => (a.date < b.date ? -1 : 1)), empty: 'No loads in this period.' } });
    blocks.push(Kit.reportMethodBlock(WHO));
    Kit.report({
      title: o.title, kicker: o.kicker || 'Recovery statement',
      subtitle: 'Every load weighed in, what it was turned into, how much metal was recovered, where it went, and the carbon that saved.',
      org: o.org, period: `${p.short} · ${p.range}`, prepared: `Prepared by Reforge Metals · ${nowText()}`,
      logo: ASSETS.logo, logoDark: ASSETS.logoDark, logoH: 28,
      filename: `${fileBit(o.file)}-recovery-${fileBit(p.short)}`,
      demo: anyDemo ? 'Demonstration figures' : false,
      meta: [...(o.meta || []), ['Loads', num(R.n)], ['Weighed in', `${n1(R.tonnes)} t`]],
      hero: [
        { label: 'CO₂-e avoided', value: n1(R.co2Avoided), unit: 't', note: 'by not making the metal new from ore' },
        { label: 'Metal recovered', value: n1(R.recovered), unit: 't', note: `${pct(R.rate)} of ${n1(R.tonnes)} t weighed in` },
        { label: 'Trees’ worth of carbon', value: num(R.trees), note: 'CO₂-e avoided ÷ what one tree absorbs in 10 years' },
      ],
      compare: compareMetal(R.recovered) + ' ' + compareCo2(R.co2Avoided),
      blocks,
    });
  }
  const periodFrom = (btn) => periodById[btn?.dataset?.period] || P();
  Kit.action('partner-report', (btn) => {
    const c = partnerById(btn.dataset.partner) || PT();
    if (!c) { Kit.toast('No partner to report on.'); return; }
    const p = periodFrom(btn);
    recoveryReport({ title: `${c.name} — Recovery statement`, org: c.name, file: c.name, period: p, demoPartner: c.demo,
      list: records().filter((r) => r.partner === c.id && inPeriod(r, p)), sites: c.sites, listLoads: true,
      meta: [['Partner', c.name], ['Sites', String(c.sites.length)]] });
  });
  Kit.action('site-report', (btn) => {
    const s = siteById(btn.dataset.site);
    const c = s && [...DEMO_PARTNERS, ...data.partners].find((x) => x.sites.includes(s));
    if (!s || !c) { Kit.toast('Site not found.'); return; }
    const p = periodFrom(btn);
    recoveryReport({ title: `${s.name} — Site recovery statement`, kicker: 'Site recovery statement', org: `${c.name} · ${s.name}`, file: `${c.name}-${s.name}`, period: p, demoPartner: c.demo,
      list: records().filter((r) => r.site === s.id && inPeriod(r, p)), sites: [s], listLoads: true,
      meta: [['Partner', c.name], ['Site', `${s.name}${s.city ? ', ' + s.city : ''}${s.state ? ' ' + s.state : ''}`]] });
  });
  Kit.action('group-report', (btn) => {
    const p = periodFrom(btn);
    const cl = partners();
    recoveryReport({ title: 'Reforge Metals — Group report', kicker: 'Group recovery report', org: WHO, file: 'Reforge-Metals', period: p,
      list: records().filter((r) => inPeriod(r, p)), byPartner: cl, demoPartner: showDemo(),
      meta: [['Partners', String(cl.length)], ['Sites', String(cl.reduce((a, c) => a + c.sites.length, 0))]] });
  });
  Kit.action('load-report', (btn) => {
    const r = records().find((x) => x.id === btn.dataset.id);
    if (!r) return;
    const c = partnerById(r.partner), s = siteById(r.site), R = agg([r]), o = outcome(r), S = STREAMS[r.stream];
    Kit.report({
      title: 'Load statement', noCover: true, org: `${c.name} · Reforge Metals`, period: `${fmtDate(r.date)}${r.docket ? ' · ' + r.docket : ''}`,
      prepared: `Prepared ${nowText()}`, logo: ASSETS.logo, logoDark: ASSETS.logoDark, logoH: 28, filename: `${fileBit(c.name)}-load-${r.date}${r.docket ? '-' + fileBit(r.docket) : ''}`,
      demo: r.demo ? 'Demonstration figures' : false,
      blocks: [
        { title: 'Weighed in → turned into → recovered → saving', html: chainStrip(R) },
        { title: 'The load', html: C.review([['Partner', esc(c.name)], ['Site', esc(siteLabel(s))], ['Date', fmtDate(r.date)], ['Docket', esc(r.docket || '—')], ['Metal in', esc(S.name)], ['Weighed in', `${t2(r.t)} t`], ['Turned into', esc(S.product)], ['Recovered', `${t2(o.recovered)} t (${pct(r.t ? o.recovered / r.t : 0)})${o.measured ? ' — weighed out' : ' — usual rate, estimate'}`], ['Residual', `${t2(o.residual)} t`], ['Went to', esc(DEST[r.dest || 'stock'].name)]]) },
        { title: 'The difference it made', html: C.impactHero(R) },
        { title: `${WHO} vs landfill`, html: C.vsLandfill(R, WHO) },
        { title: 'What happened to it', html: `<p style="font-size:13px;line-height:1.6">${esc(S.path)}.</p>` },
        Kit.reportMethodBlock(WHO),
      ],
    });
  });
})();

</script>
</body>
</html>
